name: Web preview

# On every push to master: type-check, build the web version and put a
# self-contained preview plus build logs on the `preview` branch, so the
# result can be checked and shown in chat.
on:
  push:
    # main stays here until the branch is renamed on GitHub.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          mkdir -p report
          npm install --no-audit --no-fund 2>&1 | tee report/install.log
          exit ${PIPESTATUS[0]}

      - name: Type check
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npx tsc --noEmit 2>&1 | tee report/typecheck.log
          exit ${PIPESTATUS[0]}

      - name: Export web build
        id: export
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo export --platform web --output-dir dist 2>&1 | tee report/export.log
          exit ${PIPESTATUS[0]}

      - name: Make single-page preview
        id: preview
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: node scripts/make-preview.mjs dist preview 2>&1 | tee report/preview.log

      - name: Publish to the preview branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          EXPORT: ${{ steps.export.outcome }}
          PREVIEW: ${{ steps.preview.outcome }}
        run: |
          mkdir -p preview
          cp -r report preview/report
          node -e '
            const { execSync } = require("child_process");
            const message = execSync("git log -1 --format=%s").toString().trim();
            const status = {
              sha: process.env.GITHUB_SHA, message, builtAt: new Date().toISOString(),
              install: process.env.INSTALL, typecheck: process.env.TYPECHECK,
              export: process.env.EXPORT, preview: process.env.PREVIEW,
            };
            require("fs").writeFileSync("preview/meta.json", JSON.stringify(status, null, 2));
          '
          cd preview
          git init -q -b preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" preview

      - name: Fail if anything failed
        if: steps.typecheck.outcome != 'success' || steps.export.outcome != 'success'
        run: exit 1
